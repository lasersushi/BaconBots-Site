<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BaconBots logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#5b2a1f"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#f4a896"/>
      <stop offset="50%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#f4a896"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- bacon strip -->
  <path d="M8 38 Q20 28 32 38 T56 38 L56 48 Q44 58 32 48 T8 48 Z" fill="url(#strip)" stroke="#5b2a1f" stroke-width="1.5"/>
  <!-- robot eyes -->
  <circle cx="24" cy="22" r="3.5" fill="#fff7f0"/>
  <circle cx="40" cy="22" r="3.5" fill="#fff7f0"/>
  <circle cx="24" cy="22" r="1.6" fill="#2a1410"/>
  <circle cx="40" cy="22" r="1.6" fill="#2a1410"/>
  <!-- antenna -->
  <line x1="32" y1="6" x2="32" y2="14" stroke="#fff7f0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="2" fill="#e8b04b"/>
</svg>
